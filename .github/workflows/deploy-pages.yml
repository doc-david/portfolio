# Publishes the site/ folder (and only that folder) to GitHub Pages.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Then run it from the Actions tab: "Deploy site to GitHub Pages" → "Run workflow".
#
# It runs only when started by hand. To publish on every push to main, change the trigger to:
#   on:
#     workflow_dispatch:
#     push:
#       branches: [main]
#       paths: [site/**]

name: Deploy site to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
